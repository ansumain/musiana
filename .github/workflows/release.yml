name: Build and Release Musiana APK

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Android APK & Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Expo Prebuild (Generate Native Android Project)
        working-directory: frontend
        run: npx expo prebuild --platform android --clean

      - name: Make Gradle Executable
        working-directory: frontend/android
        run: chmod +x gradlew

      - name: Build Android APK with Gradle
        working-directory: frontend/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare APK Artifact
        run: |
          mkdir -p artifacts
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk artifacts/musiana-v1.0.${{ github.run_number }}.apk

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Musiana Release v1.0.${{ github.run_number }}
          body: |
            ## Musiana Automated Build & Release 🎵
            
            - **Commit**: `${{ github.sha }}`
            - **Branch**: `${{ github.ref_name }}`
            - **Build Number**: `${{ github.run_number }}`
            
            ### Downloads
            Download and install `musiana-v1.0.${{ github.run_number }}.apk` on your Android device.
          files: artifacts/musiana-v1.0.${{ github.run_number }}.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
